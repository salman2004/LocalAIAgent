[Rainmeter]
Update=3000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Local Assistant HUD
Author=Salman
Version=1.0
Information=Ambient desktop HUD pulling live data from the local assistant's assistant_core service (CPU/RAM/GPU, service health, weather, stocks, tech news).

[Variables]
BaseURL=http://127.0.0.1:8090
ColorBg=05070AE6
ColorPanel=0B0F16F0
ColorBorder=1B2735FF
ColorAccent=35D6FFFF
ColorAccentDim=1A5B70FF
ColorText=D9F4FFFF
ColorDim=6F8EA3FF
ColorOk=37F0A3FF
ColorDanger=FF4D6DFF
FontFace=Consolas

; ---- system status (CPU/RAM/GPU + service health) --------------------

[MeasureStatus]
Measure=WebParser
URL=[#BaseURL]/system/status
RegExp=(?siU)"cpu_percent":(.*),"ram_percent":(.*),"gpu_percent":(.*),"services":\{"llm":(.*),"embedding":(.*),"stt":(.*)\}
UpdateRate=3

[MeasureCPU]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=1

[MeasureRAM]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=2

[MeasureGPU]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=3

[MeasureSvcLLM]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=4
Substitute="true":"ONLINE","false":"OFFLINE"

[MeasureSvcEmbed]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=5
Substitute="true":"ONLINE","false":"OFFLINE"

[MeasureSvcSTT]
Measure=WebParser
URL=[MeasureStatus]
StringIndex=6
Substitute="true":"ONLINE","false":"OFFLINE"

; ---- weather -----------------------------------------------------------

[MeasureWeather]
Measure=WebParser
URL=[#BaseURL]/widgets/weather
RegExp=(?siU)"location":"(.*)","temperature_c":(.*),"humidity_percent":(.*),"condition":"(.*)"
UpdateRate=600

[MeasureWeatherLoc]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=1

[MeasureWeatherTemp]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=2

[MeasureWeatherCondition]
Measure=WebParser
URL=[MeasureWeather]
StringIndex=4

; ---- stocks (fixed order: AAPL, MSFT, GOOGL, NVDA) ---------------------

[MeasureStocks]
Measure=WebParser
URL=[#BaseURL]/widgets/stocks
RegExp=(?siU)"symbol":"(.*)","price":(.*),"change_percent":(.*)\}.*"symbol":"(.*)","price":(.*),"change_percent":(.*)\}.*"symbol":"(.*)","price":(.*),"change_percent":(.*)\}.*"symbol":"(.*)","price":(.*),"change_percent":(.*)\}
UpdateRate=60

[MeasureStock1Sym]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=1
[MeasureStock1Price]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=2
[MeasureStock1Chg]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=3

[MeasureStock2Sym]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=4
[MeasureStock2Price]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=5
[MeasureStock2Chg]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=6

[MeasureStock3Sym]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=7
[MeasureStock3Price]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=8
[MeasureStock3Chg]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=9

[MeasureStock4Sym]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=10
[MeasureStock4Price]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=11
[MeasureStock4Chg]
Measure=WebParser
URL=[MeasureStocks]
StringIndex=12

; ---- tech news (first 3 headlines) -------------------------------------

[MeasureNews]
Measure=WebParser
URL=[#BaseURL]/widgets/news
RegExp=(?siU)"title":"(.*)","link".*"title":"(.*)","link".*"title":"(.*)","link"
UpdateRate=600

[MeasureNews1]
Measure=WebParser
URL=[MeasureNews]
StringIndex=1
[MeasureNews2]
Measure=WebParser
URL=[MeasureNews]
StringIndex=2
[MeasureNews3]
Measure=WebParser
URL=[MeasureNews]
StringIndex=3

; ================================ METERS ================================

[MeterBackground]
Meter=Image
SolidColor=[#ColorBg]
X=0
Y=0
W=440
H=560

[MeterBrand]
Meter=String
Text="LOCAL ASSISTANT"
FontFace=[#FontFace]
FontSize=11
FontColor=[#ColorAccent]
StringStyle=Bold
X=16
Y=14

; ---- central orb ---------------------------------------------------------

[MeterOrbOuter]
Meter=Shape
Shape=Ellipse 220,60,58 | StrokeWidth 2 | Stroke Color 26,91,112,255 | Fill Color 0,0,0,0
X=0
Y=0

[MeterOrbMid]
Meter=Shape
Shape=Ellipse 220,60,42 | StrokeWidth 1 | Stroke Color 53,214,255,140 | Fill Color 0,0,0,0
X=0
Y=0

[MeterOrbCore]
Meter=Shape
Shape=Ellipse 220,60,20 | StrokeWidth 1 | Stroke Color 53,214,255,220 | Fill Color 53,214,255,40
X=0
Y=0

